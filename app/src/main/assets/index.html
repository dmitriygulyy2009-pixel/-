<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Кубок-Босс</title>
<style>
:root{--bg:#0b0620;--card:rgba(26,17,62,.66);--line:rgba(255,255,255,.13);--gold:#ffc83d;--gold2:#ff8a1f;--pink:#ff3d9a;--cy:#38e1ff;--green:#3dff9a;--red:#ff4d5e;--txt:#f4f0ff;--mut:#a9a1d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font-family:system-ui,'Segoe UI',Roboto,sans-serif;
background:radial-gradient(120% 80% at 15% 0%,#2e1070 0%,#140a3a 45%,#06030f 100%)}
canvas{position:fixed;left:0;top:0;pointer-events:none}
#bg{z-index:0}#fx{z-index:60}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.logo{font-weight:900;letter-spacing:.08em;font-size:15px;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;color:transparent}
.date{font-size:13px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.hero{display:flex;gap:12px;align-items:flex-start}
.avatar{font-size:46px;width:68px;height:68px;flex:none;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#3b1d92,#1b0f4d);border:1px solid var(--line);animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px) rotate(-3deg)}}
.bubble{position:relative;flex:1;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:16px;padding:11px 13px;font-size:14.5px;line-height:1.35;font-weight:600;min-height:68px;display:flex;align-items:center}
.bubble:before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;background:rgba(255,255,255,.09);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.meter{margin-top:12px}
.meter .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px}
.bar{position:relative;height:10px;border-radius:9px;background:linear-gradient(90deg,#ff4d5e,#ffb23d 45%,#3dff9a);box-shadow:inset 0 0 6px rgba(0,0,0,.4)}
.knob{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #1b0f4d;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.9,.3,1.2)}
.h{font-size:13px;color:var(--mut);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.weekrow{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900}
.ring .c b{font-size:24px;display:block}.ring .c span{font-size:11px;color:var(--mut);font-weight:700}
.big{font-size:40px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff2b0,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(255,170,30,.35))}
.sub{color:var(--mut);font-size:13px;font-weight:600;margin-top:5px;line-height:1.35}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;margin-bottom:6px;background:rgba(255,255,255,.1)}
.b-zero{background:rgba(61,255,154,.2);color:var(--green)}.b-hard,.b-boss,.b-final{background:rgba(255,77,94,.2);color:#ff8a95}.b-easy{background:rgba(56,225,255,.18);color:var(--cy)}
.days{display:flex;gap:6px;margin-top:12px}
.day{flex:1;text-align:center;padding:6px 0;border-radius:11px;font-size:11px;font-weight:800;background:rgba(255,255,255,.06);color:var(--mut)}
.day.past{background:rgba(255,200,61,.16);color:var(--gold)}.day.now{background:linear-gradient(145deg,var(--gold),var(--gold2));color:#2b1400;box-shadow:0 0 14px rgba(255,170,30,.5)}
.pb{height:12px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--cy),var(--pink));transition:width 1s cubic-bezier(.2,.9,.3,1)}
.pb.g i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.two{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font-size:26px;font-weight:900}
input{width:100%;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:800;color:#fff;outline:none;font-family:inherit}
input:focus{border-color:var(--gold)}
input[type=date]{font-size:16px;color-scheme:dark}
label{display:block;font-size:12px;color:var(--mut);font-weight:800;margin:12px 0 6px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;color:#2b1400;background:linear-gradient(180deg,#ffe27a,var(--gold) 50%,var(--gold2));box-shadow:0 5px 0 #b35a00,0 10px 24px rgba(255,150,0,.35);margin-top:12px;font-family:inherit;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b35a00}
.btn.sec{background:rgba(255,255,255,.1);color:var(--txt);box-shadow:none;border:1px solid var(--line);font-size:15px}
.btn.red{background:linear-gradient(180deg,#ff7a85,var(--red));color:#fff;box-shadow:0 5px 0 #a01626}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{flex:1;text-align:center;padding:9px 0;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--txt);font-family:inherit}
.chip:active{background:rgba(255,200,61,.3)}
details summary{color:var(--mut);font-size:13px;font-weight:700;margin-top:12px;cursor:pointer}
.warn{background:rgba(255,77,94,.15);border:1px solid rgba(255,77,94,.5);color:#ffc1c7;border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:700;margin-top:12px;line-height:1.35}
.ok{background:rgba(61,255,154,.12);border:1px solid rgba(61,255,154,.4);color:#b8ffd9}
.banner{background:linear-gradient(90deg,rgba(255,61,154,.3),rgba(255,138,31,.3));border:1px solid rgba(255,138,31,.6);border-radius:16px;padding:11px 13px;margin-bottom:12px;font-weight:800;font-size:14px}
#tabs{display:flex;background:rgba(10,5,30,.92);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;background:none;border:0;color:var(--mut);font-weight:800;font-size:11px;padding:6px 0;font-family:inherit}
#tabs button b{display:block;font-size:22px;filter:grayscale(1) opacity(.6);transition:.2s}
#tabs button.on{color:var(--gold)}#tabs button.on b{filter:none;transform:translateY(-2px) scale(1.12)}
#modal{position:fixed;inset:0;z-index:80;background:rgba(5,2,18,.72);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
#modal.open{display:flex;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.sheet{width:100%;max-width:460px;max-height:92%;overflow-y:auto;background:linear-gradient(160deg,#2a1670,#150b3d);border:1px solid var(--line);border-radius:26px;padding:20px;animation:pop .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 20px 60px rgba(0,0,0,.6)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.sheet h2{margin:0 0 8px;font-size:22px}.sheet p{color:var(--mut);font-weight:600;font-size:14px;line-height:1.4;margin:6px 0}
.emoji{font-size:64px;text-align:center;margin-bottom:4px}
.rev{font-size:54px;font-weight:900;text-align:center;margin:8px 0}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.hist:last-child{border:0}.hist .e{font-size:24px}.hist .r{flex:1}.hist small{color:var(--mut);font-weight:600;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.07);border-radius:16px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mut);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:#fff;color:#1b0f4d;font-weight:800;padding:10px 16px;border-radius:20px;font-size:14px;animation:fi .2s;max-width:88%;text-align:center}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.intro{text-align:center;margin:18px 0 6px}.intro .t{font-size:64px}.intro h1{margin:6px 0;font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;color:transparent}
.intro p{color:var(--mut);font-weight:600;font-size:14px;margin:4px 12px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="app">
  <div id="view"></div>
  <div id="tabs" style="display:none">
    <button data-t="home"><b>🏆</b>Неделя</button>
    <button data-t="path"><b>📈</b>Путь</button>
    <button data-t="set"><b>⚙️</b>Настройки</button>
  </div>
</div>
<div id="modal"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const KEY='cupboss_v1';
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOWF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const mondayOf=s=>addDays(s,-((pd(s).getDay()+6)%7));
const fmtD=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
const fmtL=s=>{const d=pd(s);return d.getDate()+' '+MONF[d.getMonth()]};
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ============ state ============ */
let S=null,tab='home',curPhrase=null,lastRing=0;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ plan / targets ============ */
const wt=(i,n)=>n<=1?1:1.5-i/(n-1);          // ранние недели весят больше (до 3x по сравнению с последней)
const planN=()=>(diff(S.plan.firstMonday,S.plan.deadline)+1)/7;

function genTarget(ws,startCups){
  const n=planN(),i=diff(S.plan.firstMonday,ws)/7,left=n-i,rem=S.plan.goal-startCups;
  if(rem<=0)return{target:0,kind:'won'};
  if(left<=1)return{target:rem,kind:'final'};
  let sum=0;for(let j=i;j<n;j++)sum+=wt(j,n);
  const base=rem*wt(i,n)/sum;
  const r=S.respect;
  let m=clamp(1-0.4*r/100,.6,1.4)*(0.75+Math.random()*0.5);
  const pz=r>=40?Math.min(.22,.04+(r-40)/60*.18):0;
  if(Math.random()<pz)return{target:0,kind:'zero'};
  let kind='normal';
  if(Math.random()<(r<0?.12:.07)){m*=1.5+Math.random()*.5;kind='boss'}
  let t=base*m;
  t=Math.min(t,Math.max(6000,base));
  t=Math.round(t/100)*100;
  t=Math.max(300,Math.min(t,rem));
  if(kind!=='boss'){if(t<base*.75)kind='easy';else if(t>base*1.25)kind='hard'}
  return{target:t,kind};
}
function planCalc(cups,goal,dl){
  const mon=mondayOf(today());let d=dl||addDays(mon,6);
  const dow=pd(d).getDay();if(dow!==0)d=addDays(d,(7-dow)%7);
  if(d<addDays(mon,6))d=addDays(mon,6);
  const weeks=(diff(mon,d)+1)/7,rem=goal-cups;
  return{d,weeks,rem,avg:rem/weeks,mon};
}
function closeWeek(){
  const w=S.week,gained=S.cups-w.startCups;let d,res;
  if(w.target===0){res=gained>0?'bonus':'rest';d=gained>0?Math.min(25,8+Math.round(gained/150)):1}
  else{const q=gained/w.target;
    if(q>=1.3){res='crush';d=5+Math.min(15,Math.round((q-1)*15))}
    else if(q>=1){res='win';d=4}
    else if(q>=.7){res='close';d=-Math.round(6+(1-q)*20)}
    else{res='fail';d=-Math.min(45,Math.round(10+(1-q)*30))}}
  const before=S.respect;S.respect=clamp(before+d,-100,100);
  const rec={start:w.start,end:w.end,startCups:w.startCups,endCups:S.cups,target:w.target,gained,res,d:S.respect-before,kind:w.kind};
  S.history.push(rec);S.reports.push(rec);return rec;
}
function advanceWeek(){
  const rec=closeWeek();
  const ws=addDays(S.week.start,7);
  if(S.cups>=S.plan.goal){S.status='won';return}
  if(ws>S.plan.deadline){S.status='failed';return}
  const g=genTarget(ws,S.cups);
  S.week={start:ws,end:addDays(ws,6),startCups:S.cups,target:g.target,kind:g.kind};
  S.log=[];rec.next=g;
}
function dayStartCups(){const t=today();let c=S.week.startCups;for(const e of S.log)if(e.date<t)c=e.total;return c}

/* ============ phrases ============ */
const P={
start:[["Новая неделя, а у тебя ноль? Шевелись.","Цель висит, а прогресса нет. Не разочаруй меня снова."],["Неделя началась. Запиши первые кубки!","Понедельник — отличный день для старта. Погнали!"],["Новая неделя — новые рекорды! Я в тебя верю, чемпион.","Стартуем! С тобой цель — просто формальность 😎"]],
behind:[["Ты отстаёшь. Поиграй, иначе не успеешь!","Темп никакой. Бери телефон и фарми!"],["Чуть отстаёшь от графика — пора поиграть.","Надо ускориться, иначе к воскресенью будет тяжело."],["Небольшое отставание, но ты можешь выдать за день кучу кубков!","Чуть отстаёшь, но я знаю — ты разгонишься."]],
onpace:[["Идёшь по графику. Не расслабляйся — я слежу.","Нормально. Но «нормально» меня не впечатляет."],["Идёшь точно по плану. Так держать!","Темп хороший. Чуть-чуть каждый день — и цель твоя."],["Идеальный темп! Ты как швейцарские часы.","Всё по плану, красавчик!"]],
ahead:[["Хм, обгоняешь график. Продолжай, и я, может, смягчусь.","Неплохо... для тебя."],["Ты опережаешь график! Отличная работа.","Впереди плана — так держать!"],["Ты летишь как ракета! Красавчик!","Опережаешь график — просто легенда! 🔥"]],
done:[["Цель недели закрыта. Ладно, признаю: сработало.","Выполнил... в этот раз. Посмотрим, что дальше."],["Цель недели выполнена! Любой лишний кубок поднимет моё уважение.","Готово! Можно отдыхать или фармить ради респекта."],["ЦЕЛЬ НЕДЕЛИ ЗАКРЫТА! Ты чемпион, красавчик! 🏆","Выполнено! Всё, что сверху — чистый респект."]],
zero:[["Цель 0. Не радуйся, это не подарок.","Ноль. Но я за тобой слежу."],["На этой неделе цель — 0. Отдыхай!","Ноль кубков по плану. Если сыграешь — респект вырастет 😉"],["Цель на неделю — 0, ты это заслужил! Отдыхай, легенда.","Ноль! Но если сыграешь — я буду в восторге 😉"]],
zeroPlayed:[["Цель была 0, а ты всё равно фармишь?! Хм, уважаю.","Сверх плана. Моё мнение о тебе меняется."],["Цель 0, а ты фармишь! Респект растёт.","Над планом! Так держать."],["Цель 0, а ты фармишь?! Вот это фанат! 🤩","Ты неостановим! Моё уважение растёт!"]],
sundayBehind:[["ВОСКРЕСЕНЬЕ! Последний шанс, а ты не успеваешь. Играй давай!","Сегодня конец недели. Не добьёшь — следующая будет тяжелее."],["Сегодня воскресенье — осталось добить цель. Поиграй, иначе не успеешь!","Последний день недели. Запиши итог до конца дня!"],["Последний рывок! Ты можешь добить цель сегодня, я знаю!","Воскресный камбэк? Ты у нас мастер финишей!"]],
failed:[["Дедлайн прошёл, а цели нет. Поставь новую и докажи мне всё."]],
won:[["Ты сделал это! Цель достигнута. Ты легенда! 🏆"]],
add:[["Наконец-то хоть что-то.","Засчитано. Продолжай."],["Кубки капают! Так держать!","Записал. Хороший прогресс."],["Красавчик! Кубки летят!","Вот это да! Копим дальше 🔥"]],
addBig:[["Ого. Это уже что-то.","Вот это куча! Ладно, засчитаю."],["Ого, целая куча кубков! Отличная сессия!","Мощно! Так держать."],["ВАУ! Какая куча кубков! Ты просто монстр! 🔥","Красавчик! Вот это набор!"]],
addNeg:[["Минус кубки? Слабо...","Откатился? Не надо так."],["Минус? Бывает. Отыграешься!","Записал. Не переживай."],["Бывает, чемпион! Отыграешься с процентами.","Один шаг назад — два вперёд!"]],
addZero:[["Ничего не изменилось. Серьёзно?"],["Количество кубков не изменилось."],["Всё те же кубки. Пора в бой!"]]
};
const RES={
crush:["ТЫ РАЗНЁС ЦЕЛЬ! Моё уважение взлетает 🚀","Вот это перевыполнение! Теперь буду мягче."],
win:["Цель недели выполнена. Уважаю!","Всё чётко. Так держать!"],
close:["Чуть-чуть не дотянул. Я немного недоволен...","Почти. В следующий раз надо лучше."],
fail:["Провал. Теперь цели будут тяжелее!","Ты даже не приблизился... Я разочарован."],
bonus:["Цель была 0, а ты фармил! Моё уважение растёт 🤩","Играл ради удовольствия? Так и надо!"],
rest:["Отдохнул — молодец. Но дальше будет интереснее."]
};
const RESE={crush:'🚀',win:'🏆',close:'😤',fail:'💥',bonus:'🤩',rest:'😴'};
const KINDT={zero:'Ноль! Отдыхай… но если сыграешь — респект вырастет.',easy:'Лёгкая неделя. Босс в хорошем настроении.',normal:'Обычная неделя. Всё по-честному.',hard:'Тяжеловато, но ты справишься!',boss:'🔥 БОСС-НЕДЕЛЯ! Мощный заход.',final:'Финальная неделя: всё, что осталось до цели!',won:'Цель достигнута!'};
const KINDB={zero:'НОЛЬ',easy:'ЛЁГКАЯ',normal:'ОБЫЧНАЯ',hard:'ТЯЖЁЛАЯ',boss:'БОСС-НЕДЕЛЯ',final:'ФИНАЛ'};
const tone=()=>S.respect<-20?0:S.respect>25?2:1;
function say(k){const p=P[k];const pool=Array.isArray(p[0])?(p[tone()]||p[0]):p;return rnd(pool)}
function mood(){const r=S.respect;
  if(r<-60)return['😡','Презрение'];if(r<-25)return['😠','Недоволен'];if(r<10)return['😐','Присматривается'];
  if(r<45)return['🙂','Одобряет'];if(r<75)return['😎','Уважает'];return['🤩','Легенда в моих глазах']}
function situation(){
  if(S.status==='won')return'won';if(S.status==='failed')return'failed';
  const w=S.week,t=today(),g=S.cups-w.startCups;
  if(w.target===0)return g>0?'zeroPlayed':'zero';
  if(g>=w.target)return'done';
  if(diff(t,w.end)+1<=1)return'sundayBehind';
  const di=Math.max(0,diff(w.start,t));
  if(di===0&&g<=0)return'start';
  const pace=g/(w.target*(di+1)/7);
  return pace<.6?'behind':pace>1.25?'ahead':'onpace';
}

let modalLock=false;
function modal(html,lock){modalLock=!!lock;const m=$('#modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');modalLock=false}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!modalLock)closeModal()});
window.__back=()=>{if($('#modal').classList.contains('open')&&!modalLock){closeModal();return true}
  if(S&&tab!=='home'){tab='home';render();return true}return false};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function animNum(el,a,b,ms){if(!el)return;const t0=performance.now();
  (function f(t){const k=clamp((t-t0)/ms,0,1),e=1-Math.pow(1-k,3);el.textContent=fmt(a+(b-a)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function rollNum(el,final,ms){const t0=performance.now();
  (function f(t){const k=(t-t0)/ms;if(k>=1){el.textContent='+'+fmt(final);el.classList.add('bump');vib([30,40,60]);return}
    el.textContent='+'+fmt(Math.random()*6000);requestAnimationFrame(f)})(t0)}

function bindPlan(getCups){
  const upd=()=>{
    const c=getCups(),g=parseInt($('#pf-g').value),dl=$('#pf-d').value,box=$('#pf-i');
    if(!isFinite(c)||!isFinite(g)||!dl){box.innerHTML='';return}
    const p=planCalc(c,g,dl);
    if(p.rem<=0){box.innerHTML='<div class="warn">Цель должна быть больше текущих кубков 😉</div>';return}
    let h=`<div class="sub">Дедлайн: воскресенье <b>${fmtL(p.d)}</b>${p.d!==dl?' (подвинул на ближайшее воскресенье)':''}<br>Недель: <b>${p.weeks}</b> · в среднем <b>+${fmt(p.avg)}</b> кубков в неделю</div>`;
    if(p.avg>3000){const need=Math.ceil(p.rem/3000),sd=addDays(p.mon,need*7-1);
      h+=`<div class="warn">⚠️ Советую выбрать дату подальше, ибо набор будет слишком тяжёлым.<br>Например: ${fmtL(sd)}<button class="chip" style="width:100%;margin-top:8px" id="pf-sug">Подставить эту дату</button></div>`}
    else h+='<div class="warn ok" style="margin-top:8px">Нормальный темп, реально! 💪</div>';
    box.innerHTML=h;const b=$('#pf-sug');if(b)b.onclick=()=>{$('#pf-d').value=addDays(p.mon,Math.ceil(p.rem/3000)*7-1);upd()};
  };
  ['pf-c','pf-g','pf-d'].forEach(id=>{const e=$('#'+id);if(e){e.oninput=upd;e.onchange=upd}});upd();
}

/* ============ entries ============ */
function addEntry(total,date){
  const t=today();date=date||t;
  if(date<S.week.start)date=S.week.start;if(date>t)date=t;
  const id=Date.now();
  S.log.push({id,date,total});
  S.log.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
  const i=S.log.findIndex(e=>e.id===id);
  const prev=i>0?S.log[i-1].total:S.week.startCups;
  S.cups=S.log[S.log.length-1].total;
  return total-prev;
}
function submitEntry(){
  const raw=$('#inp').value.replace(/\s/g,'');if(!raw)return toast('Впиши количество кубков');
  const total=raw[0]==='+'?S.cups+parseInt(raw.slice(1)):parseInt(raw);
  if(!isFinite(total)||total<0)return toast('Некорректное число');
  const dt=$('#dt')?$('#dt').value:null;
  const prevCups=S.cups,wasDone=S.cups-S.week.startCups>=S.week.target;
  const delta=addEntry(total,dt);
  let sit=delta>=200?'addBig':delta>0?'add':delta<0?'addNeg':'addZero';
  const p=P[sit];curPhrase=rnd(p[tone()]||p[0]);
  let won=false;
  if(S.cups>=S.plan.goal&&S.status==='active'){closeWeek();S.status='won';won=true}
  save();render();
  if(S.cups>prevCups){setTimeout(()=>rain(S.cups-prevCups,prevCups),60);vib(30)}
  const nowDone=S.cups-S.week.startCups>=S.week.target&&S.week.target>0;
  if(won){setTimeout(()=>confetti(160),900)}
  else if(!wasDone&&nowDone){setTimeout(()=>{confetti(90);toast('🎉 Цель недели выполнена!')},1400)}
}

function renderPath(){
  const h=S.history,done=h.filter(x=>x.res==='win'||x.res==='crush'||x.res==='bonus'||x.res==='rest').length;
  const best=h.reduce((m,x)=>Math.max(m,x.gained),0),total=S.cups-S.plan.base;
  const dl=S.status==='active'?Math.max(0,planN()-diff(S.plan.firstMonday,S.week.start)/7):0;
  const tw=Math.max(1,h.length+dl);
  const pts=[S.plan.base];h.forEach(x=>pts.push(x.endCups));if(S.status==='active')pts.push(S.cups);
  const lo=Math.min(...pts),hi=S.plan.goal,sx=i=>12+i/tw*276,sy=v=>108-(v-lo)/Math.max(1,hi-lo)*96;

  $('#s1').onclick=()=>openReplan();
  $('#s2').onclick=()=>{if(S.status!=='active')return toast('Сначала поставь новую цель');
    modal(`<h2>Кубки на понедельник</h2><p>Сколько у тебя было в начале этой недели?</p><input id="mc" type="number" inputmode="numeric" value="${S.week.startCups}"><button class="btn" id="ok">Сохранить</button><button class="btn sec" id="no">Отмена</button>`);
    $('#no').onclick=closeModal;$('#ok').onclick=()=>{const v=parseInt($('#mc').value);if(!isFinite(v)||v<0)return toast('Некорректное число');S.week.startCups=v;save();closeModal();render();toast('Готово')}};
  $('#s3').onclick=()=>{if(S.status!=='active'||!S.log.length)return toast('Нечего отменять');
    S.log.pop();S.cups=S.log.length?S.log[S.log.length-1].total:S.week.startCups;save();curPhrase=null;toast('Последняя запись удалена');render()};
  $('#s4').onclick=()=>{modal(`<h2>Сбросить всё?</h2><p>Весь прогресс, историю и уважение босса удалим навсегда.</p><button class="btn red" id="y">Да, сбросить</button><button class="btn sec" id="no">Отмена</button>`);
    $('#no').onclick=closeModal;$('#y').onclick=()=>{S=null;try{localStorage.removeItem(KEY)}catch(e){}closeModal();tab='home';render()}};
}
function openReplan(){
  modal(`<h2>Новая цель</h2>${planForm({goal:S.plan.goal,deadline:S.plan.deadline})}<button class="btn" id="ok">Сохранить</button><button class="btn sec" id="no">Отмена</button>`);
  bindPlan(()=>S.cups);$('#no').onclick=closeModal;
  $('#ok').onclick=()=>{
    const g=parseInt($('#pf-g').value),dl=$('#pf-d').value;if(!isFinite(g)||!dl)return toast('Заполни цель и дату');
    const p=planCalc(S.cups,g,dl);if(p.rem<=0)return toast('Цель должна быть больше кубков');
    const wasActive=S.status==='active';
    S.plan.goal=g;S.plan.deadline=p.d;S.plan.firstMonday=wasActive?S.week.start:p.mon;S.plan.base=S.cups;
    closeModal();curPhrase=null;
    if(!wasActive){S.status='active';const gt=genTarget(p.mon,S.cups);S.week={start:p.mon,end:addDays(p.mon,6),startCups:S.cups,target:gt.target,kind:gt.kind};S.log=[];save();render();showReveal('Новая цель недели!',gt)}
    else{save();render();toast('План обновлён')}
  };
}
function render(){
  if(!S){$('#tabs').style.display='none';renderSetup();return}
  $('#tabs').style.display='flex';
  ({home:renderHome,path:renderPath,set:renderSettings})[tab]();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}

/* ============ visuals ============ */
const bg=$('#bg'),bx=bg.getContext('2d'),fx=$('#fx'),fc=fx.getContext('2d');
let W=0,H=0,dpr=1,tx=0,ty=0,stars=[],floats=[],nebs=[],comets=[],FX=[],nextComet=2,SP={};
function sprite(ch,s){const c=document.createElement('canvas');c.width=c.height=Math.round(s*1.5);const x=c.getContext('2d');
  x.font=s+'px "Apple Color Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(255,200,60,.9)';x.shadowBlur=14;x.fillText(ch,c.width/2,c.height/2+s*.06);return c}
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  [bg,fx].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px'});
  bx.setTransform(dpr,0,0,dpr,0,0);fc.setTransform(dpr,0,0,dpr,0,0);
}
function initVis(){
  resize();
  ['🏆','⭐','💎','✨','🔥','🚀'].forEach(e=>SP[e]=sprite(e,64));
  stars=Array.from({length:130},()=>({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*.8,f:1+Math.random()*3,p:Math.random()*6}));
  const em=['🏆','🏆','⭐','💎','✨','🔥','🚀','🏆','⭐','💎'];
  floats=em.map(e=>({sp:SP[e],x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*14,vy:-6-Math.random()*14,r:Math.random()*6,vr:(Math.random()-.5)*.8,s:26+Math.random()*34,ph:Math.random()*6,z:.4+Math.random()*.6}));
  nebs=[{x:.2,y:.2,r:300,a:0,s:.12,c:'rgba(120,60,255,.30)'},{x:.85,y:.55,r:280,a:2,s:.09,c:'rgba(255,60,160,.17)'},{x:.4,y:.9,r:320,a:4,s:.1,c:'rgba(40,200,255,.15)'}];
}
addEventListener('resize',()=>{resize()});
addEventListener('deviceorientation',e=>{tx=clamp((e.gamma||0)/30,-1,1);ty=clamp(((e.beta||0)-45)/30,-1,1)});
const COL=['#ffc83d','#ff3d9a','#38e1ff','#3dff9a','#ff8a1f','#b77bff'];
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*160;FX.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,m:1,c:col||rnd(COL),r:1.5+Math.random()*2.5})}}
function confetti(n){for(let i=0;i<n;i++)FX.push({k:'c',x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*80,vy:80+Math.random()*180,rot:Math.random()*6,vr:(Math.random()-.5)*10,w:6+Math.random()*6,h:9+Math.random()*8,c:rnd(COL)});vib([40,30,40])}
function rain(delta,prev){
  const el=$('#totalNum');if(!el)return;
  const r=el.getBoundingClientRect(),tx_=r.left+r.width/2,ty_=r.top+r.height/2;
  const n=clamp(Math.round(delta/8),8,70),spread=Math.min(2000,900+n*25);
  animNum(el,prev,S.cups,spread+700);
  for(let i=0;i<n;i++)FX.push({k:'cup',sx:Math.random()*W,sy:-40-Math.random()*60,tx:tx_+(Math.random()-.5)*40,ty:ty_,t:0,delay:i*spread/n/1000,dur:.7+Math.random()*.4,sz:22+Math.random()*14,sw:(Math.random()-.5)*80,rot:Math.random()*6,el});
}
addEventListener('pointerdown',e=>{sparks(e.clientX,e.clientY,8)},{passive:true});

function drawBg(t,dt){
  bx.clearRect(0,0,W,H);
  bx.globalCompositeOperation='lighter';
  for(const n of nebs){n.a+=dt*n.s;const x=n.x*W+Math.cos(n.a)*60+tx*25,y=n.y*H+Math.sin(n.a*1.3)*80+ty*25;
    const g=bx.createRadialGradient(x,y,0,x,y,n.r);g.addColorStop(0,n.c);g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(x-n.r,y-n.r,n.r*2,n.r*2)}
  bx.globalCompositeOperation='source-over';
  for(const s of stars){s.y+=s.z*9*dt;s.x-=s.z*3*dt;if(s.y>H+4){s.y=-4;s.x=Math.random()*W}if(s.x<-4)s.x=W+4;
    const a=(.25+.75*(.5+.5*Math.sin(t*s.f+s.p)))*s.z,x=s.x+tx*14*s.z,y=s.y+ty*14*s.z;
    bx.fillStyle='rgba(255,255,255,'+a+')';bx.beginPath();bx.arc(x,y,.5+s.z*1.3,0,6.28);bx.fill();
    if(s.z>.85){bx.fillStyle='rgba(255,230,160,'+a*.4+')';bx.fillRect(x-4,y-.4,8,.8);bx.fillRect(x-.4,y-4,.8,8)}}
  nextComet-=dt;if(nextComet<=0){nextComet=3+Math.random()*5;const x=Math.random()*W*1.1;comets.push({x,y:-20,vx:-200-Math.random()*150,vy:260+Math.random()*160,l:1})}
  for(let i=comets.length-1;i>=0;i--){const c=comets[i];c.x+=c.vx*dt;c.y+=c.vy*dt;c.l-=dt*.45;if(c.l<=0||c.y>H+50){comets.splice(i,1);continue}
    const g=bx.createLinearGradient(c.x,c.y,c.x-c.vx*.22,c.y-c.vy*.22);g.addColorStop(0,'rgba(255,240,190,'+c.l+')');g.addColorStop(1,'rgba(255,240,190,0)');
    bx.strokeStyle=g;bx.lineWidth=2;bx.beginPath();bx.moveTo(c.x,c.y);bx.lineTo(c.x-c.vx*.22,c.y-c.vy*.22);bx.stroke()}
  for(const f of floats){f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.vr*dt;
    if(f.y<-60){f.y=H+60;f.x=Math.random()*W}if(f.x<-60)f.x=W+60;if(f.x>W+60)f.x=-60;
    const bob=Math.sin(t*1.2+f.ph)*10,x=f.x+bob+tx*40*f.z,y=f.y+ty*40*f.z,s=f.s*(1+.08*Math.sin(t*2+f.ph));
    bx.save();bx.translate(x,y);bx.rotate(f.r);bx.globalAlpha=.25+.4*f.z;bx.drawImage(f.sp,-s/2,-s/2,s,s);bx.restore()}
}
function drawFx(dt){
  fc.clearRect(0,0,W,H);if(!FX.length)return;
  for(let i=FX.length-1;i>=0;i--){const p=FX[i];
    if(p.k==='cup'){p.t+=dt;if(p.t<p.delay)continue;const k=(p.t-p.delay)/p.dur;
      if(k>=1){sparks(p.tx,p.ty,5,'#ffc83d');if(p.el){p.el.classList.remove('bump');void p.el.offsetWidth;p.el.classList.add('bump')}FX.splice(i,1);continue}
      const x=p.sx+(p.tx-p.sx)*k+Math.sin(k*3.14)*p.sw,y=p.sy+(p.ty-p.sy)*k*k,s=p.sz*(1-.35*k);
      fc.save();fc.translate(x,y);fc.rotate(p.rot+k*5);fc.globalAlpha=Math.min(1,k*8);fc.drawImage(SP['🏆'],-s/2,-s/2,s,s);fc.restore()}
    else if(p.k==='s'){p.l-=dt;if(p.l<=0){FX.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;
      fc.globalAlpha=Math.max(0,p.l/p.m);fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.28);fc.fill();fc.globalAlpha=1}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.vx*=.995;if(p.y>H+30){FX.splice(i,1);continue}
      fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore()}}
}
let last=0;
function frame(ms){const dt=Math.min(.05,(ms-last)/1000||.016);last=ms;drawBg(ms/1000,dt);drawFx(dt);requestAnimationFrame(frame)}

/* ============ boot ============ */
initVis();requestAnimationFrame(frame);
let lastDay=today();
function tick(){const d=today();if(d!==lastDay){lastDay=d;curPhrase=null;if(S&&!$('#modal').classList.contains('open'))check()}}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
check();
</script>
</body>
